project_name = "cargo-promote"
project_path = "."
output_path = "./litho.docs"
target_language = "en"

[llm]
provider = "openai"
api_base_url = "https://api.openai.com/v1"
model_efficient = "gpt-4o-mini"
model_powerful = "gpt-4o"
max_tokens = 16384
temperature = 0.1
retry_attempts = 3
retry_delay_ms = 5000
timeout_seconds = 300
disable_preset_tools = false
max_parallels = 3
max_turns = 100
tool_concurrency = 4
# api_key left unset — resolved from LITHO_LLM_API_KEY env var at runtime

[cache]
enabled = true
cache_dir = ".litho/cache"
expire_hours = 168
